<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surf Whale — Look up any Hyperliquid wallet</title>
<meta name="description" content="Look up any Hyperliquid wallet's net worth, returns, and full trade performance stats — win rate, profit factor, drawdown, Sharpe/Sortino, and more." />
<link rel="icon" href="assets/logo.jpg" />
<style>
  :root {
    --bg: #0b0e11;
    --panel: #14181d;
    --border: #262b31;
    --text: #e6e9ec;
    --muted: #8a939d;
    --teal: #4ecdc4;
    --sunset-1: #ff9a76;
    --sunset-2: #f4708a;
    --sunset-3: #8b6fb3;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .brand span { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  header nav a {
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    margin-left: 28px;
  }
  header nav a:hover { color: var(--text); }

  .page-head {
    text-align: center;
    padding: 48px 0 40px;
  }
  .section-label {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .page-head h1 {
    font-size: 36px;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .page-head p {
    color: var(--muted);
    font-size: 16px;
    max-width: 560px;
    margin: 0 auto;
  }

  section.lookup { padding: 0 0 90px; }
  .lookup-panel {
    max-width: 720px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
  }
  .lookup-panel form { display: flex; gap: 12px; }
  .lookup-panel input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .lookup-panel input:focus { outline: 1px solid var(--teal); }
  .lookup-panel button {
    background: linear-gradient(135deg, var(--sunset-1), var(--sunset-3));
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    color: #0b0e11;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .lookup-panel button:hover { opacity: 0.9; }
  .lookup-status { color: var(--muted); font-size: 14px; margin: 20px 0 0; }

  .result-section { margin-top: 32px; }
  .result-section h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }
  .stat-grid .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-grid .stat-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-grid .stat-value { display: block; font-size: 18px; font-weight: 700; }
  .stat-grid .stat-value.pos { color: var(--teal); }
  .stat-grid .stat-value.neg { color: var(--sunset-2); }

  footer {
    border-top: 1px solid var(--border);
    padding: 28px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 13px;
  }
  footer .brand img { width: 24px; height: 24px; border-radius: 6px; }
  footer .brand span { font-size: 14px; font-weight: 600; color: var(--text); }

  @media (max-width: 600px) {
    header nav { display: none; }
    .page-head h1 { font-size: 28px; }
    .lookup-panel form { flex-direction: column; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <div class="brand">
        <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;">
          <img src="assets/logo.jpg" alt="Surf Whale" />
          <span>Surf Whale</span>
        </a>
      </div>
      <nav>
        <a href="lookup.html">Look up a wallet</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#how">How it works</a>
      </nav>
    </header>
  </div>

  <section class="page-head">
    <div class="wrap">
      <div class="section-label">Try it now</div>
      <h1>Look up any Hyperliquid wallet</h1>
      <p>Paste an address to see net worth, returns, and full trade performance — win rate, profit factor, drawdown, Sharpe/Sortino, and more.</p>
    </div>
  </section>

  <section class="lookup">
    <div class="wrap">
      <div class="lookup-panel">
        <form id="lookup-form">
          <input type="text" id="lookup-address" placeholder="0x..." autocomplete="off" spellcheck="false" />
          <button type="submit">Look up</button>
        </form>
        <div id="lookup-result"></div>
      </div>
    </div>
  </section>

  <div class="wrap">
    <footer>
      <div class="brand">
        <img src="assets/logo.jpg" alt="Surf Whale" />
        <span>Surf Whale</span>
      </div>
      <div>&copy; 2026 Surf Whale</div>
    </footer>
  </div>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:8001'
      : 'https://api.surfwhale.io';

    const fmtUsd = (n) => n == null ? '—' : '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const fmtUsdSigned = (n) => n == null ? '—' : (n >= 0 ? '$' : '-$') + Math.abs(Number(n)).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const fmtPct = (n) => n == null ? '—' : (n * 100).toFixed(1) + '%';
    const fmtNum = (n, d = 2) => n == null ? '—' : Number(n).toFixed(d);
    const cls = (n) => n == null ? '' : (n >= 0 ? 'pos' : 'neg');

    const form = document.getElementById('lookup-form');
    const input = document.getElementById('lookup-address');
    const resultEl = document.getElementById('lookup-result');

    async function runLookup(address) {
      resultEl.innerHTML = '<p class="lookup-status">Looking up…</p>';
      try {
        const res = await fetch(`${API_BASE}/api/public/wallet/${address}`);
        if (res.status === 429) {
          resultEl.innerHTML = '<p class="lookup-status">Too many lookups from this browser — try again in a bit.</p>';
          return;
        }
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          resultEl.innerHTML = `<p class="lookup-status">${body.detail || 'Could not find that wallet.'}</p>`;
          return;
        }
        const d = await res.json();
        const p = d.performance || {};
        resultEl.innerHTML = `
          <div class="result-section">
            <h3>Wallet Overview</h3>
            <div class="stat-grid">
              <div class="stat"><span class="stat-label">Net worth</span><span class="stat-value">${fmtUsd(d.net_worth)}</span></div>
              <div class="stat"><span class="stat-label">Win rate</span><span class="stat-value">${fmtPct(d.win_rate)}</span></div>
              <div class="stat"><span class="stat-label">Trades</span><span class="stat-value">${d.trade_count ?? '—'}</span></div>
              <div class="stat"><span class="stat-label">Actual return</span><span class="stat-value ${cls(d.actual_return)}">${fmtPct(d.actual_return)}</span></div>
              <div class="stat"><span class="stat-label">Annualized return</span><span class="stat-value ${cls(d.annualized_return)}">${fmtPct(d.annualized_return)}</span></div>
              <div class="stat"><span class="stat-label">Funding-only return</span><span class="stat-value ${cls(d.funding_annualized_return)}">${fmtPct(d.funding_annualized_return)}</span></div>
            </div>
            ${d.days != null ? `<p class="lookup-status">Based on ${Math.round(d.days)} days of history.</p>` : ''}
          </div>
          <div class="result-section">
            <h3>Trade Performance</h3>
            <div class="stat-grid">
              <div class="stat"><span class="stat-label">Net profit</span><span class="stat-value ${cls(p.net_profit)}">${fmtUsdSigned(p.net_profit)}</span></div>
              <div class="stat"><span class="stat-label">Profit factor</span><span class="stat-value">${fmtNum(p.profit_factor)}</span></div>
              <div class="stat"><span class="stat-label">Gross profit</span><span class="stat-value pos">${fmtUsdSigned(p.gross_profit)}</span></div>
              <div class="stat"><span class="stat-label">Gross loss</span><span class="stat-value neg">${fmtUsdSigned(p.gross_loss)}</span></div>
              <div class="stat"><span class="stat-label">Avg win</span><span class="stat-value pos">${fmtUsdSigned(p.avg_win)}</span></div>
              <div class="stat"><span class="stat-label">Avg loss</span><span class="stat-value neg">${fmtUsdSigned(p.avg_loss)}</span></div>
              <div class="stat"><span class="stat-label">Largest win</span><span class="stat-value pos">${fmtUsdSigned(p.largest_win)}</span></div>
              <div class="stat"><span class="stat-label">Largest loss</span><span class="stat-value neg">${fmtUsdSigned(p.largest_loss)}</span></div>
              <div class="stat"><span class="stat-label">Max drawdown</span><span class="stat-value neg">${fmtUsdSigned(p.max_drawdown)}</span></div>
              <div class="stat"><span class="stat-label">Sharpe ratio</span><span class="stat-value ${cls(p.sharpe_ratio)}">${fmtNum(p.sharpe_ratio)}</span></div>
              <div class="stat"><span class="stat-label">Sortino ratio</span><span class="stat-value ${cls(p.sortino_ratio)}">${fmtNum(p.sortino_ratio)}</span></div>
              <div class="stat"><span class="stat-label">Max consecutive wins</span><span class="stat-value">${p.max_consecutive_wins ?? '—'}</span></div>
              <div class="stat"><span class="stat-label">Max consecutive losses</span><span class="stat-value">${p.max_consecutive_losses ?? '—'}</span></div>
            </div>
          </div>
        `;
      } catch (err) {
        resultEl.innerHTML = '<p class="lookup-status">Could not reach the lookup service — it may still be coming online.</p>';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const address = input.value.trim();
      if (address) runLookup(address);
    });

    const deepLinkAddress = new URLSearchParams(window.location.search).get('address');
    if (deepLinkAddress) {
      input.value = deepLinkAddress;
      runLookup(deepLinkAddress);
    }
  </script>
</body>
</html>
